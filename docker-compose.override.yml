# docker-compose.override.yml
# 本地开发热重载配置(不入生产)
# `docker compose up` 会自动加载此文件
# 大宗商品改造期间(Phase 0-4)使用,Phase 5 后可保留也可删除

services:
  backend:
    # 覆盖 Dockerfile.backend 的 COPY,挂载本地源码实现热重载
    volumes:
      - ./tradingagents:/app/tradingagents
      - ./app:/app/app
    environment:
      # 开发模式自动重载
      DEBUG: "true"
      UVICORN_RELOAD: "true"
      # Phase 0 引入的 4 个 feature flag
      # Phase 3a 完成 → ENABLE + DATA = true(本地开发默认开启商品数据/列表/详情页)
      # Phase 3b 后 ANALYSI = true(分析师任务)
      # Phase 4 后  PAPER = true(模拟交易)
      FEATURE_COMMODITY_ENABLED: "true"
      FEATURE_COMMODITY_DATA: "true"
      FEATURE_COMMODITY_ANALYSIS: "false"
      FEATURE_COMMODITY_PAPER: "false"

  frontend:
    # 前端源码热重载(开发期)
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    # 启动开发服务器而非生产 nginx
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"  # Vite 默认端口
