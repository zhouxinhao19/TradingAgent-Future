# docker-compose.override.yml
# 本地开发热重载配置(不入生产)
# `docker compose up` 会自动加载此文件
# 大宗商品改造期间(Phase 0-4)使用,Phase 5 后可保留也可删除

services:
  backend:
    # 覆盖 Dockerfile.backend 的 COPY,挂载本地源码实现热重载
    volumes:
      - ./tradingagents:/app/tradingagents
      - ./app:/app/app
    environment:
      # 开发模式自动重载
      DEBUG: "true"
      UVICORN_RELOAD: "true"
      # Phase 0 引入的 4 个 feature flag(本地默认全部关闭)
      FEATURE_COMMODITY_ENABLED: "false"
      FEATURE_COMMODITY_DATA: "false"
      FEATURE_COMMODITY_ANALYSIS: "false"
      FEATURE_COMMODITY_PAPER: "false"

  frontend:
    # 前端源码热重载(开发期)
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    # 启动开发服务器而非生产 nginx
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"  # Vite 默认端口
